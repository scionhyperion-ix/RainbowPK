name: Check Rainbow Web JavaScript

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/js/**'
      - 'index.html'
      - '.github/workflows/web-js-check.yml'

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: find assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
